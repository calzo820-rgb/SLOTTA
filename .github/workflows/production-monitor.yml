name: Production monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check production
        id: monitor
        continue-on-error: true
        run: node scripts/check-production.mjs

      - name: Open or update incident issue
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] Slotta production check failed'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            const body = `Controllo produzione fallito: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }

      - name: Close recovered incident
        if: steps.monitor.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] Slotta production check failed'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            for (const issue of issues.filter(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Il controllo produzione è tornato operativo.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
            }

      - name: Fail workflow when production is unavailable
        if: steps.monitor.outcome == 'failure'
        run: exit 1
